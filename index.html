<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>appsbymyst</title>
  <meta name="description" content="appsbymyst — Moments with Myst: life, music and gaming.">
  <meta name="theme-color" content="#65799b">
  <link rel="icon" type="image/svg+xml" href="images/yt_watermark.svg">
  <link rel="icon" type="image/png" href="images/yt_watermark.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <a class="logo" href="./">
        <img src="images/logo.png" width="682" height="615" alt="Moments with Myst — Life, Music, Gaming">
      </a>
      <div class="hero__text">
        <h1>appsbymyst</h1>
        <p class="tagline">Moments with Myst</p>
        <p class="intro">Welcome to appsbymyst. More is on the way.</p>
      </div>
    </header>

    <main class="content">
      <div class="cards" role="tablist" aria-label="Sections">
        <button class="card card--life" type="button" role="tab" id="tab-life" data-section="life" aria-controls="panel-life" aria-selected="true">Life</button>
        <button class="card card--music" type="button" role="tab" id="tab-music" data-section="music" aria-controls="panel-music" aria-selected="false" tabindex="-1">Music</button>
        <button class="card card--gaming" type="button" role="tab" id="tab-gaming" data-section="gaming" aria-controls="panel-gaming" aria-selected="false" tabindex="-1">Gaming</button>
      </div>

      <section class="panel panel--life" id="panel-life" role="tabpanel" aria-labelledby="tab-life">
        <h2>Life</h2>
      </section>
      <section class="panel panel--music" id="panel-music" role="tabpanel" aria-labelledby="tab-music" hidden>
        <h2>Music</h2>
      </section>
      <section class="panel panel--gaming" id="panel-gaming" role="tabpanel" aria-labelledby="tab-gaming" hidden>
        <h2>Gaming</h2>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> appsbymyst</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
